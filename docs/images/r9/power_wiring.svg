<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820"><rect width="1400" height="820" fill="#f3f7fc"/><style>text{font-family:Microsoft YaHei,Arial;fill:#173147}.t{font-size:30px;font-weight:700}.b{font-size:22px}.s{font-size:18px}.tiny{font-size:16px}</style><text class="t" x="45" y="55">R9 · 一块现有 5V 电池，共用电源</text><text class="s" x="45" y="90">电气连接示意；针号按物理 BOARD 编号，板上左右位置以丝印为准。</text><rect x="45" y="135" width="300" height="130" rx="18" fill="#dceafd" stroke="#abc2d5"/><text class="b" x="70" y="178">原舵机电池</text><text class="b" x="70" y="218">5V 成品输出 · DC 插头</text><text class="s" x="70" y="246">不使用裸 2S / 12V 电池</text><rect x="405" y="135" width="400" height="280" rx="18" fill="#d8f4eb" stroke="#abc2d5"/><text class="b" x="430" y="178">微雪 Bus Servo Adapter (A)</text><text class="b" x="430" y="222">黑色 DC 圆孔：接电池</text><text class="b" x="430" y="270">绿色 DC+：红线 → X5 2脚</text><text class="b" x="430" y="310">绿色 DC−：黑线 → X5 6脚</text><text class="s" x="430" y="350">两路 D / V / G：保留舵机连接</text><text class="s" x="430" y="386">USB-C：仍接 X5 USB HOST</text><path d="M345 200H405" fill="none" stroke="#236bbe" stroke-width="6"/><rect x="890" y="135" width="460" height="590" rx="18" fill="#fff" stroke="#abc2d5"/><text class="b" x="915" y="178">RDK X5 · J9 / 40PIN</text><text class="s" x="915" y="213">先找到板上 PIN1 标识</text><circle cx="1000" cy="245" r="8" fill="#e6ecf3"/><text class="tiny" x="960" y="250">1</text><circle cx="1080" cy="245" r="8" fill="#e14d51"/><text class="tiny" x="1050" y="250">2</text><circle cx="1000" cy="266" r="8" fill="#e6ecf3"/><text class="tiny" x="960" y="271">3</text><circle cx="1080" cy="266" r="8" fill="#e6ecf3"/><text class="tiny" x="1050" y="271">4</text><circle cx="1000" cy="287" r="8" fill="#e6ecf3"/><text class="tiny" x="960" y="292">5</text><circle cx="1080" cy="287" r="8" fill="#374151"/><text class="tiny" x="1050" y="292">6</text><circle cx="1000" cy="308" r="8" fill="#e6ecf3"/><text class="tiny" x="960" y="313">7</text><circle cx="1080" cy="308" r="8" fill="#e6ecf3"/><text class="tiny" x="1050" y="313">8</text><circle cx="1000" cy="329" r="8" fill="#e6ecf3"/><text class="tiny" x="960" y="334">9</text><circle cx="1080" cy="329" r="8" fill="#e6ecf3"/><text class="tiny" x="1050" y="334">10</text><circle cx="1000" cy="350" r="8" fill="#e6ecf3"/><text class="tiny" x="960" y="355">11</text><circle cx="1080" cy="350" r="8" fill="#e6ecf3"/><text class="tiny" x="1050" y="355">12</text><circle cx="1000" cy="371" r="8" fill="#e6ecf3"/><text class="tiny" x="960" y="376">13</text><circle cx="1080" cy="371" r="8" fill="#e6ecf3"/><text class="tiny" x="1050" y="376">14</text><circle cx="1000" cy="392" r="8" fill="#e6ecf3"/><text class="tiny" x="960" y="397">15</text><circle cx="1080" cy="392" r="8" fill="#e6ecf3"/><text class="tiny" x="1050" y="397">16</text><circle cx="1000" cy="413" r="8" fill="#e6ecf3"/><text class="tiny" x="960" y="418">17</text><circle cx="1080" cy="413" r="8" fill="#e6ecf3"/><text class="tiny" x="1050" y="418">18</text><circle cx="1000" cy="434" r="8" fill="#e6ecf3"/><text class="tiny" x="960" y="439">19</text><circle cx="1080" cy="434" r="8" fill="#e6ecf3"/><text class="tiny" x="1050" y="439">20</text><circle cx="1000" cy="455" r="8" fill="#e6ecf3"/><text class="tiny" x="960" y="460">21</text><circle cx="1080" cy="455" r="8" fill="#e6ecf3"/><text class="tiny" x="1050" y="460">22</text><circle cx="1000" cy="476" r="8" fill="#e6ecf3"/><text class="tiny" x="960" y="481">23</text><circle cx="1080" cy="476" r="8" fill="#e6ecf3"/><text class="tiny" x="1050" y="481">24</text><circle cx="1000" cy="497" r="8" fill="#e6ecf3"/><text class="tiny" x="960" y="502">25</text><circle cx="1080" cy="497" r="8" fill="#e6ecf3"/><text class="tiny" x="1050" y="502">26</text><circle cx="1000" cy="518" r="8" fill="#e6ecf3"/><text class="tiny" x="960" y="523">27</text><circle cx="1080" cy="518" r="8" fill="#e6ecf3"/><text class="tiny" x="1050" y="523">28</text><circle cx="1000" cy="539" r="8" fill="#e6ecf3"/><text class="tiny" x="960" y="544">29</text><circle cx="1080" cy="539" r="8" fill="#e6ecf3"/><text class="tiny" x="1050" y="544">30</text><circle cx="1000" cy="560" r="8" fill="#e6ecf3"/><text class="tiny" x="960" y="565">31</text><circle cx="1080" cy="560" r="8" fill="#e6ecf3"/><text class="tiny" x="1050" y="565">32</text><circle cx="1000" cy="581" r="8" fill="#e6ecf3"/><text class="tiny" x="960" y="586">33</text><circle cx="1080" cy="581" r="8" fill="#e6ecf3"/><text class="tiny" x="1050" y="586">34</text><circle cx="1000" cy="602" r="8" fill="#e6ecf3"/><text class="tiny" x="960" y="607">35</text><circle cx="1080" cy="602" r="8" fill="#e6ecf3"/><text class="tiny" x="1050" y="607">36</text><circle cx="1000" cy="623" r="8" fill="#e6ecf3"/><text class="tiny" x="960" y="628">37</text><circle cx="1080" cy="623" r="8" fill="#e6ecf3"/><text class="tiny" x="1050" y="628">38</text><circle cx="1000" cy="644" r="8" fill="#e6ecf3"/><text class="tiny" x="960" y="649">39</text><circle cx="1080" cy="644" r="8" fill="#e6ecf3"/><text class="tiny" x="1050" y="649">40</text><text class="s" x="1130" y="227">5V · 接 DC+</text><text class="s" x="1130" y="317">GND · 接 DC−</text><text class="s" x="915" y="695">4脚同为5V，本图用2脚；1脚是3.3V。</text><path d="M805 264H850V120H1370V245H1088" fill="none" stroke="#e14d51" stroke-width="5"/><path d="M805 304H865V750H1385V287H1088" fill="none" stroke="#374151" stroke-width="5"/><rect x="45" y="450" width="760" height="130" rx="18" fill="#fff1d6" stroke="#abc2d5"/><text class="b" x="70" y="490">先关机断电，再接线</text><text class="s" x="70" y="525">拔掉 X5 原 USB-C 电源，避免两路电源同时接入。</text><text class="s" x="70" y="556">杜邦接头要插紧、固定防拉；线长与线径按实际负载选。</text><text class="b" x="45" y="635">测点 A：微雪 DC+ 对 DC−</text><text class="b" x="45" y="675">测点 B：X5 2脚对6脚（板端电压）</text><text class="s" x="45" y="725">先上电只读检查，再用原成功 D 单轮做带载对照。</text><text class="s" x="45" y="762">端子分出的是同一电池电源；不是额外的稳压电源输出。</text></svg>