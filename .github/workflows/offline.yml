name: Offline controller checks
on:
  push:
    paths: ['software/**', 'simulation/**', '.github/workflows/offline.yml']
  pull_request:
    paths: ['software/**', 'simulation/**', '.github/workflows/offline.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-tested.txt
      - run: python -m unittest discover -s tests -v
      - run: python runtime.py plan --cycles 5
  simulation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v test_simulation
      - run: python run.py inspect
